<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Homework</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== TEMEL SAYFA AYARLARI ===== */
      body {
        margin: 0;
        background: #fff; /* tam beyaz arka plan */
        font-family: "Afacad", Arial, sans-serif;
        color: #111;
        text-align: center;
      }

      /* Sağ üstte derece + şehir */
      .weather {
        position: absolute; /* sayfanın sağ üst köşesine sabitler */
        top: 20px;
        right: 18px;
        text-align: right;
        font-size: 32px; /* 36° yazısı */
        line-height: 1.1;
      }
      .weather .city {
        display: block; /* alt satıra insin */
        margin-top: 6px;
        font-size: 20px;
        color: #6e6cdf; /* mor ton */
        font-weight: 700;
      }

      /* Saat ve selamlama */
      .clock {
        font-size: 74px; /* masaüstü için büyük */
        font-weight: 800;
        margin: 260px 0 10px; /* yukarıdan boşluk + aşağıdan küçük boşluk */
      }
      .greet {
        font-size: 36px;
        color: #6e6cdf;
        font-weight: 700;
        margin: 0 0 28px;
      }

      /* ===== ARAMA KUTUSU ===== */
      .search {
        width: 620px; /* masaüstü genişliği */
        max-width: 92%; /* dar ekranda taşmasın */
        height: 65px;
        margin: 0 auto 26px; /* ortala + alttan küçük boşluk */
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fafafa; /* açık gri dolgu */
        border: 1px solid #eee; /* ince gri çizgi */
        border-radius: 16px; /* pill görünüm */
        box-sizing: border-box;
      }

      .search-bubble img {
        width: 12px;
        height: 12px;
        display: block;
        opacity: 0.6; /* soluk dursun */
      }

      /* Yazı alanı */
      .search input {
        flex: 1; /* kalan alanın tamamını kapla */
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        color: #333;
      }
      .search input::placeholder {
        color: #9aa2b1;
      } /* soluk placeholder */

      /* ===== ALTTAKİ UYGULAMA İKONLARI ===== */
      .icons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap; /* gerekirse alt satıra geçsin */
        gap: 14px;
        margin: 0 auto 40px;
        max-width: 92%;
      }
      .icon {
        width: 48px;
        height: 48px;
        border: 1px solid #eee;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon img {
        max-width: 60%;
        max-height: 60%;
        display: block;
      }

      /* ===== MOBİL (480px ve altı) — hedef görsele birebir ayarlandı ===== */
      @media (max-width: 480px) {
        /* derece ve şehir biraz küçülsün, kenara iyice yaklaşsın */
        .weather {
          top: 12px;
          right: 10px;
          font-size: 22px;
        }
        .weather .city {
          font-size: 14px;
          margin-top: 4px;
        }

        /* saat ve selamlama daha küçük ve biraz yukarıda */
        .clock {
          font-size: 44px;
          margin: 120px 0 10px;
        }
        .greet {
          font-size: 18px;
          margin-bottom: 24px;
        }

        /* arama çubuğu neredeyse tam genişlik ve daha aşağıda */
        .search {
          height: 52px;
          max-width: 92%;
          margin-top: 140px; /* >>> aramayı aşağı itmek için (hedefteki gibi) */
          margin-bottom: 18px;
          border-radius: 16px;
        }
        .search-bubble {
          width: 22px;
          height: 22px;
        }
        .search-bubble img {
          width: 11px;
          height: 11px;
        }
        .search input {
          font-size: 14px;
        }

        /* ikonlar biraz küçülsün; satır arası boşluk ufak */
        .icons {
          gap: 12px;
          margin-bottom: 26px;
        }
        .icon {
          width: 44px;
          height: 44px;
          border-radius: 10px;
        }

        /* SADECE MOBİLDE LinkedIn ve + ikonlarını gizle */
        .hide-mobile {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="weather">
      36°
      <span class="city">Ahmedabad</span>
    </div>

    <h1 class="clock">09:11:01</h1>
    <p class="greet">Good Morning, Saad.</p>

    <!-- arama kutusu (solda açık gri yuvarlak içinde büyüteç) -->
    <div class="search">
      <div class="search-bubble">
        <!-- yerel ikon dosyan; istersen PNG/SVG fark etmez -->
        <img src="images/search-01.svg" alt="Search" />
      </div>
      <input type="text" placeholder="Search" />
    </div>

    <!-- uygulama ikonları -->
    <div class="icons">
      <div class="icon"><img src="images/youtube.png" alt="Youtube" /></div>
      <div class="icon"><img src="images/chat-gpt.png" alt="Chatgpt" /></div>
      <div class="icon">
        <img src="images/icons8-geeksforgeeks-48.png" alt="Gfg" />
      </div>
      <div class="icon">
        <img src="images/icons8-deepseek-48.png" alt="Deepseek" />
      </div>
      <div class="icon">
        <img src="images/icons8-github-48.png" alt="Github" />
      </div>

      <!-- Bu ikisi masaüstünde görünür, mobilde gizlenir -->
      <div class="icon hide-mobile">
        <img src="images/icons8-linked-in-48.png" alt="Linkedin" />
      </div>
      <div class="icon hide-mobile">
        <img src="images/icons8-plus-48.png" alt="Add" />
      </div>
    </div>
  </body>
</html>
